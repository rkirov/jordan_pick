# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.3) — metadata for ONE Palomar entry: Pick's theorem.
#
# This repository hosts three independent formalizations and submits each as its own Palomar
# entry, each with its own metadata file so that the classification and the literature
# account describe the submitted result and nothing else. The repository-root
# formalization.yaml remains the repo-wide record covering all three.
version: "v0.3"

project:
  name: "jordan_pick — Pick's theorem (Lean 4 / Mathlib)"
  authors:
    - "Rado Kirov"
  responsible_maintainers:
    - name: "Rado Kirov"
      github: "rkirov"
      role: "author and sole maintainer of the substantive formalization"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  # The substantive development is JordanPick/PicksTheorem/ in this repository.
  # submission/pick/ is a thin Challenge/Solution workspace vendored from it by
  # submission/bundle-engine.sh so it compiles against Mathlib alone.

classification:
  # Classifies the submitted result — Pick's theorem — and nothing else here.
  arxiv:
    - "math.MG"    # lattice polygons, area of a plane region
    - "math.CO"    # the identity is a lattice-point count
  msc2020:
    - "52B20"      # Lattice polytopes in convex geometry
    - "52C05"      # Lattices and convex bodies in 2 dimensions (discrete geometry)
    - "51M25"      # Length, area and volume in real or complex geometry
    - "52A38"      # Length, area, volume and convex sets
    - "11H06"      # Lattices and convex bodies (number-theoretic aspects)
    - "11P21"      # Lattice points in specified regions
    - "55M25"      # Degree, winding number — the spine of this proof

sources:
  - title: "Geometrisches zur Zahlenlehre (the original statement of Pick's theorem)"
    authors: ["Georg Alexander Pick"]
    id: >
      Sitzungsberichte des deutschen naturwissenschaftlich-medicinischen Vereines für Böhmen
      "Lotos" in Prag, (Neue Folge) 19 (1899), 311-319. No DOI or stable digital copy is known
      to us; this is the standard bibliographic reference for the theorem's first appearance.
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "n/a"
    note: >
      Cited as the origin of the theorem, not as the route taken. Pick's 1899 note was not
      consulted; the formalization states the standard modern form and proves it by an
      independent route (winding-number spine plus ear-clipping induction) that is not Pick's
      argument. Because the source cannot be independently confirmed by us, no claim rests on
      its content beyond the attribution of the statement.
  - title: "Polygons Have Ears"
    authors: ["Gary H. Meisters"]
    id: "Amer. Math. Monthly 82(6) (1975), 648-651; doi:10.2307/2319703"
    type: "paper"
    relationship: "background"
    author_endorsement: "n/a"
    note: >
      Supplies the two-ears theorem behind the ear-clipping reduction. The diagonal split
      formalized here is the deepest-contained-vertex construction rather than Meisters' own;
      the source supplies the idea, not the recorded result.
  - title: "Formalizing Pick's Theorem, efficiently"
    authors: ["Michael Eisermann"]
    id: "arXiv:2603.23095"
    type: "paper"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >
      Supplies the discrete-angle-weight device used on the count side: `latWeight` in
      Submission/Weight.lean is that paper's `dang`, and `latWeightSum` plays the role of its
      `Welp`. The per-edge identity is proved independently here, by a column decomposition
      rather than a four-box partition with a reflection involution — see the Weight.lean
      module header. This paper is also a prior Lean formalization and is recorded again under
      `related_formalizations`.
  - title: "lean-eval problem `pick` (the exact formal statement submitted)"
    authors: ["Lean FRO (leanprover/lean-eval)"]
    id: "https://lean-lang.org/eval/problems/pick/"
    type: "other"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >
      Not a mathematical source: the formal specification whose Lean statement is proved
      verbatim, including the eight auxiliary definitions reproduced in the Challenge.
      Recorded so a reader can see the statement was fixed by a third party rather than chosen
      here. The repository no longer targets lean-eval.

related_formalizations:
  - id: "arXiv:2603.23095 — Formalizing Pick's Theorem, efficiently (Michael Eisermann; Lean 4)"
    relationship: "adapts"
    note: >
      The nearest prior Lean work. This development adapts its discrete-angle-weight device on
      the count side (`dang` -> `latWeight`, `Welp` -> `latWeightSum`) but ports no code and
      proves the per-edge identity by a different decomposition. On our reading of that
      development, the geometric half — the polygonal Jordan curve theorem and the ear-clipping
      reduction — is left unproved there; that half is what is completed here. Readers should
      check that development directly rather than rely on our characterization of it.
  - id: "John Harrison, A formal proof of Pick's theorem, Math. Struct. Comput. Sci. 21(4) (2011), 715-729; doi:10.1017/S0960129511000089 (HOL Light)"
    relationship: "independent"
    note: >
      Prior formalization in a different system. Consulted as prior art only; no code,
      definitions, or proof structure were ported, and nothing here depends on it.
  - id: "arXiv:2405.01793 — Formalizing Pick's Theorem in Isabelle/HOL (Sage Binder, Katherine Kosaian); doi:10.1007/978-3-031-66997-2_7; AFP entry `Picks_Theorem`"
    relationship: "independent"
    note: "Prior formalization in a different system. Consulted as prior art only; no code ported."

status:
  scope: >
    Pick's theorem (Freek Wiedijk's Formalizing 100 Theorems #92): a simple polygon whose
    vertices lie on the integer lattice has area I + B/2 - 1, where I and B count the interior
    and boundary lattice points. Area here is the genuine Lebesgue measure of the enclosed
    region, not the shoelace formula taken as a definition; the shoelace identity is itself a
    proved theorem. Not present in Mathlib at the pinned revision db584cd6, checked by
    searching that checkout. No novelty is claimed for the theorem, which is classical, nor for
    formalizing it in general: it has been formalized in HOL Light and Isabelle/HOL, and
    partially in Lean (see `related_formalizations`). What is original here is the geometric
    half — the polygonal Jordan curve theorem and the ear-clipping reduction — which on our
    reading the prior Lean development leaves unproved. The repository snapshot is licensed
    Apache-2.0.
  sorry_count: 0                        # Scope: the submitted result and the JordanPick/
                                        # library it is built from. Excludes the deliberate
                                        # `sorry` in Challenge.lean, which is the statement
                                        # hole Comparator requires. The unrelated, in-progress
                                        # Uniformization/ development is NOT covered.
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  in_progress:
    - directory: "Uniformization/"
      goal: "the uniformization theorem (Hubbard, Teichmüller theory Vol. 1, Thm 1.1.2)"
      sorry_count: 2
      notes: >
        A separate, unfinished development in the same repository. Not submitted, nothing in
        this entry depends on it, and the counts above exclude it.
  main_results:
    - declaration: "pick"                  # root namespace, as selected by theorem_names
      file: "Challenge.lean (statement); Solution.lean (proof)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "submission/pick/config.json"
      literature_dependencies: []
      note: >
        Mathlib's `Polygon`, the topological interior, and no orientation hypothesis. Bridged
        to LeanEval.Geometry.PicksTheorem.pick in Submission/EvalBridgeMain.lean, thence to
        Pick.pick.
    - declaration: "Pick.pick"
      file: "Submission/Pick.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: >
        The library form, stated for a positively-oriented simple LatticePolygon with area the
        Lebesgue measure of the winding interior. The submitted `pick` needs no orientation
        hypothesis; the bridge supplies it.
    - declaration: "Pick.compl_boundary_atMost_two"
      file: "Submission/Pick.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: >
        The polygonal Jordan curve theorem: the complement of a simple polygon's boundary is
        covered by two preconnected pieces, with the winding number locally constant in {0,1}.
        Part of the original content of this development.

automation:
  methods:
    - method: "autonomous"
      models: ["claude-fable-5", "claude-opus-4-8"]
      framework: "Claude Code"
      tool_setup: >
        Claude Code with background sub-agent orchestration. Soundness gate: every claimed
        close is independently kernel-verified with `#print axioms` (sorryAx must be absent)
        before being trusted, and every commit is `lake build`-green. No custom tactic,
        decision procedure, or external oracle contributes to any proof; nothing is admitted by
        `native_decide` or an unverified extension.
      cost:
        wall_time: "assembled repository history 2026-06-26 to 2026-07-02 (development predates the assembled history)"
        spend_usd: "subscription-based usage, $100/month subscription"
        hardware: "single 4-core / ~8 GB laptop; API-only model access"
      prompting_notes: >
        Steered with terse high-level directives; the working discipline is encoded in project
        memory rather than per-task prompts: connect already-proven pieces bottom-up, verify
        every agent commit by kernel axiom check, and flag rather than paper over a statement
        that is false as stated.
  spend_usd: "subscription-based usage ($100/month subscription; no separate API spend)"
  notes: >
    Human involvement is direction, statement selection, architecture review, and acceptance;
    the Lean text is model-produced. A human did not line-by-line audit the development, which
    is why the assurance claimed here rests on the kernel and the Comparator rather than on
    human reading — see `review`. The Pick development is sorry-free, with no custom axioms, no
    `native_decide` or other compiled-evaluation escape hatch, and no compiler warnings; no file
    in it or in this workspace contains a `maxHeartbeats` override, so every proof elaborates
    inside Lean's default 200k budget. The workspace is mechanically generated from the library
    by submission/bundle-engine.sh, which rewrites module prefixes so it compiles against
    Mathlib alone. Its one substantive edit is in Submission/EvalBridge.lean, which drops the
    library's own copy of the eight helper definitions and takes them from ChallengeDeps
    instead, so the Solution is built from declarations identical to the ones Challenge.lean
    states the theorem with.

fidelity:
  divergences: >
    Area is the genuine Lebesgue measure of the winding interior, not the shoelace formula
    taken as a definition; the shoelace identity is a proved theorem (Green: area = the double
    integral of the winding number = shoelace). The spine of the development is the winding
    number as a per-edge signed ray-crossing sum — pure integer arithmetic, with no
    transcendental angles and no general topology — and the area identity is reduced to
    triangles by ear-clipping induction (Meisters' two-ears theorem, realized via a
    deepest-contained-vertex diagonal split rather than Meisters' own construction). The count
    side follows Eisermann's discrete-angle-weight device; the per-edge identity is proved by a
    column decomposition rather than his four-box partition with a reflection involution. The
    library theorem Pick.pick assumes positive orientation; the submitted `pick` does not, and
    the bridge discharges that hypothesis by vertex reversal.
  definitions: >
    The Challenge imports Mathlib and nothing else, and carries eight auxiliary definitions
    reproduced verbatim from the problem statement — lean-eval factors them into a separate
    ChallengeDeps module, and they are inlined in the Challenge here so that its transitive
    import closure stays Mathlib-only; the text is byte-identical and the theorem statement is
    unchanged. Each is intended in its ordinary mathematical sense:
    `toPlane` is the coordinatewise cast Z^2 -> R^2; `latPoly` is Mathlib's `Polygon` on integer
    vertex data; `inside S` is the set of points off S whose connected component in the
    complement is bounded — the topological (not winding) interior, and for a simple closed
    curve the Jordan interior; `area S` is the real Lebesgue measure `volume (inside S)`, so the
    area side of the identity is genuine measure and not a coordinate formula; `Adjacent` is
    cyclic adjacency of edge indices via `finRotate`; `IsSimple` requires nondegenerate edges,
    disjoint non-adjacent edges, and consecutive edges meeting exactly in their shared vertex —
    this is what excludes self-intersecting and degenerate polygons, and it is a genuine
    hypothesis, not a convenience; `boundaryPts` and `interiorPts` are `Nat.card` of the lattice
    points on the polygon's boundary and in `inside` respectively. `IsSimple` and 3 <= n are the
    only restrictions: no orientation, convexity, or non-degeneracy beyond simplicity is
    assumed. None of these is left as a Comparator definition hole; all are fixed in the
    Challenge and none is supplied by the Solution.
  limitations: >
    The submitted result carries no hidden hypotheses beyond those in its statement: 3 <= n and
    `IsSimple`. It depends on Lean's three standard axioms (propext, Classical.choice,
    Quot.sound) and on nothing else. The `sorry` in Challenge.lean is the deliberate statement
    hole Comparator requires and is excluded from the counts above. The separate Uniformization/
    development in this repository is unfinished and not submitted.

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    Verification here is by Lean's kernel, not by a human or by peer review: `#print axioms
    pick` reports exactly [propext, Classical.choice, Quot.sound] with no sorryAx; `lake build`
    of the library and of this workspace is green and warning-free; and a repository-wide sweep
    confirms no `sorry` outside Uniformization/ and the deliberate Challenge hole. Every commit
    additionally runs Comparator over this workspace in CI with the independent NanoDa kernel
    forced on, so the Solution is replayed by two kernels rather than one. What none of this
    establishes is that a mathematician has read the proof: no expert review has taken place,
    and the informal account here was written by the same process that produced the Lean.
    Expert review is welcome.

alignment:
  namespace: "Pick (the development), LeanEval.Geometry.PicksTheorem (the bridge), root `pick` (the submitted statement)"
  statements:
    - source: "Pick's theorem (Pick 1899; Freek Wiedijk, Formalizing 100 Theorems #92)"
      lean: "pick"
      module: "Challenge (statement), Solution (proof)"
      comparator_config: "submission/pick/config.json"
      status: "proved"
      plain_language: >
        A simple polygon whose vertices all sit on the integer lattice has area exactly
        I + B/2 - 1, where I counts the lattice points strictly inside it and B counts those on
        its boundary. "Area" is the Lebesgue measure of the region the polygon encloses, so the
        identity relates a measure-theoretic quantity to two integer counts.
      note: >
        The statement uses Mathlib's `Polygon`, the topological interior, and no orientation
        hypothesis; at least three vertices and simplicity are the only hypotheses.
    - source: "Polygonal Jordan curve theorem"
      lean: "Pick.compl_boundary_atMost_two"
      module: "Submission/Pick.lean"
      status: "proved"
      note: >
        The complement of a simple polygon's boundary is covered by two preconnected pieces,
        with the winding number locally constant and valued in {0,1}. Original to this
        development and the ingredient the prior Lean work leaves unproved.

acknowledgements: >
  Built on Mathlib (Lean 4, pin db584cd6d46c92f209a44c0f1c829460d327499d) and released under
  Apache-2.0. The count side follows the discrete-angle-weight device of Michael Eisermann
  (arXiv:2603.23095), and the ear-clipping reduction rests on Meisters' two-ears theorem;
  everything else, including the polygonal Jordan curve theorem, is clean-room. Prior
  formalizations — Harrison in HOL Light, Binder and Kosaian in Isabelle/HOL, Eisermann in Lean
  — are credited as prior art in `related_formalizations`; no code was ported from any of them.
  The formal problem statement is by the Lean FRO (leanprover/lean-eval).
