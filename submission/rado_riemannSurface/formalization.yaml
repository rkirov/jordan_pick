    scripts/make_rado_submission.sh, which rewrites module prefixes so it compiles against
    Mathlib alone without importing the rest of the repository; the proof text is otherwise
    the library text.

fidelity:
  divergences: >
    The proof follows Anghel-Stan's Perron treatment with two formalization-motivated
    deviations, both recorded in Rado/PLAN.md as route "A'": (i) an explicit two-disk
    configuration with log-barriers — unit disks at ±4 inside the chart ball B(0,8), witnesses
    at ±4 + 2^(1/4) — in place of general Dirichlet boundary regularity, and (ii) an étale
    space of exact harmonic-conjugate germs (Re F = u exactly, so sheets differ by imaginary
    constants) in place of the universal cover, with descent via Poincaré-Volterra. Both
    deviations change the proof, not the theorem: the statement proved is the standard one.
  definitions: >
    The Challenge introduces no definitions. It imports Mathlib alone and states the theorem in
    Mathlib's own vocabulary: `T2Space`, `ConnectedSpace`, `ChartedSpace ℂ`,
    `IsManifold (modelWithCornersSelf ℂ ℂ) 1`, and `SecondCountableTopology`.
    One point deserves explicit justification, because the smoothness index invites the wrong
    reading. `IsManifold (modelWithCornersSelf ℂ ℂ) 1 X` is the Riemann-surface hypothesis, not
    a topological or merely-`C^1` one. `IsManifold I n X` asks that the chart transitions lie in
    `contDiffGroupoid n I`, whose defining property is `ContDiffOn 𝕜 n` for the field `𝕜` of the
    model `I`. Here `I = modelWithCornersSelf ℂ ℂ`, so `𝕜 = ℂ` and the transitions are `C^1`
    over ℂ — complex differentiable, not merely real differentiable. A map complex
    differentiable on an open set is holomorphic, hence analytic, so `C^1` compatibility over ℂ
    already is holomorphic compatibility.
    Two contrasts pin this down. The genuinely topological hypothesis is index `0`, not `1`:
    Mathlib proves `contDiffGroupoid_zero_eq : contDiffGroupoid 0 I = continuousGroupoid H`, so
    `IsManifold I 0 X` is exactly a topological manifold and carries no analytic content. And
    since `1 ≤ ω`, assuming `1` is the weaker hypothesis, so proving Radó's theorem from it is
    strictly stronger than proving it from `ω`.
    This is proved rather than asserted. Submission/Surface/HolomorphicCompat.lean contains
    `contDiffGroupoid_one_le_omega_complex` (over ℂ the `C^1` transition groupoid is contained
    in the analytic one) and `isManifold_omega_of_one` (hence any `X` satisfying the Challenge
    hypothesis is an analytic manifold). The two hypotheses are therefore equivalent here, and
    the Challenge is a faithful rendering of "every connected Riemann surface is second
    countable". The same argument appears in the Challenge module documentation.
  limitations: >
    The submitted result is a theorem about the objects just described and carries no hidden
    hypotheses beyond those in its statement: a connected, Hausdorff `ChartedSpace ℂ` that
    `IsManifold`. It depends on Lean's three standard axioms (propext, Classical.choice,
    Quot.sound) and on nothing else. The `sorry` in Challenge.lean is the deliberate statement
    hole Comparator requires and is excluded from the counts above; the Solution supplies the
    proof. The separate Uniformization/ development in this repository is unfinished and is not
    submitted.

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    Verification here is by Lean's kernel, not by a human or by peer review. Specifically:
    `#print axioms rado_riemannSurface` reports exactly [propext, Classical.choice, Quot.sound]
    with no sorryAx; `lake build` of Rado/ and of this workspace is green and warning-free; and
    a repository-wide sweep confirms no `sorry` outside Uniformization/ and the deliberate
    Challenge hole. Every commit additionally runs Comparator over this workspace in CI with
    the independent NanoDa kernel forced on, so the Solution is replayed by two kernels rather
    than one. An earlier revision passed the lean-eval comparator on 2026-07-10, under that
    harness's pin (Lean v4.32.2, Mathlib 905b9581) rather than this commit's. What none of this
    establishes is that a mathematician has read the proof: no expert review has taken place,
    and the informal account here and in the Challenge documentation was written by the same
    process that produced the Lean. Expert review is welcome. Junyan Xu, who submitted the
    problem statement, has expressed interest in upstreaming pieces of this development — the
    Poincaré-Volterra lemma, the Dirichlet disk solution, and Perron's principle — to Mathlib;
    that is an expression of interest, not a review or an endorsement.

alignment:
  namespace: "Rado (the development), root `rado_riemannSurface` (the submitted statement)"
  statements:
    - source: "Radó's theorem (Radó 1925; Anghel-Stan Thms 6-7; Hubbard §1.3)"
      lean: "rado_riemannSurface"
      module: "Challenge (statement), Solution (proof)"
      comparator_config: "submission/rado_riemannSurface/config.json"
      status: "proved"
      plain_language: >
        Every connected Riemann surface has a countable base of open sets. Second countability
        is usually imposed as part of the definition; Radó's theorem says the assumption is
        redundant — a connected Hausdorff space that merely carries a one-dimensional
        complex-analytic atlas is automatically second countable, hence metrizable and
        triangulable. The complex structure, not any topological hypothesis beyond connectedness
        and Hausdorffness, forces the countability; the analogous claim fails for real surfaces.
      note: >
        Stated in pure Mathlib terms: a connected T2 `ChartedSpace ℂ` satisfying
        `IsManifold (modelWithCornersSelf ℂ ℂ) 1` has `SecondCountableTopology`. On why that
        hypothesis is holomorphic rather than topological, see `fidelity.definitions`. Bridged
        to Rado.secondCountableTopology_of_riemannSurface; the route is Perron on a two-disk
        configuration -> an étale space of exact harmonic-conjugate germs -> Poincaré-Volterra
        -> descent (route A', Rado/PLAN.md).
    - source: "The surface hypothesis is holomorphic, not topological"
      lean: "isManifold_omega_of_one"
      module: "Submission/Surface/HolomorphicCompat.lean"
      status: "proved"
      note: >
        Over ℂ, `C^1` chart compatibility implies analytic compatibility, so the Challenge
        hypothesis is equivalent to the analytic-atlas one. Supporting lemma:
        `contDiffGroupoid_one_le_omega_complex`.
    - source: "Forster, Lectures on Riemann Surfaces §23.2 (Poincaré-Volterra lemma)"
      lean: "Rado.poincare_volterra"
      module: "Submission/Topology/PoincareVolterra.lean"
      status: "proved"
      note: >
        A connected, Hausdorff, locally compact, locally connected, locally second-countable
        space admitting a continuous discrete-fiber map to a second-countable Hausdorff space is
        second countable. Proved from scratch, not assumed.
    - source: "Forster, Lectures on Riemann Surfaces §22.3 (Dirichlet problem on a disk)"
      lean: "Rado.exists_harmonic_extension"
      module: "Submission/Complex/Poisson.lean"
      status: "proved"
      note: >
        Continuous boundary data on a circle extends continuously to the closed disk and
        harmonically inside. Proved from scratch, not assumed.
    - source: "Anghel-Stan, Uniformization of Riemann surfaces revisited, Proposition 3 (Perron's principle)"
      lean: "Rado.IsPerronFamily.surfaceHarmonicOn_perronSup"
      module: "Submission/Surface/Perron.lean"
      status: "proved"
      note: "The upper envelope of a Perron family on a Riemann surface is harmonic."

