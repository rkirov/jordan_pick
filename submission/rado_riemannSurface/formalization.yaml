# formalization.yaml (v0.3) — metadata for ONE Palomar entry: Radó's theorem.
#
# This repository hosts three independent formalizations and submits each as its own
# Palomar entry. Each entry has its own metadata file so that the classification and the
# literature account describe the submitted result and nothing else:
#
#   submission/rado_riemannSurface/formalization.yaml   <- this file, Radó's theorem
#   submission/jordan_curve/formalization.yaml          Jordan curve theorem
#   submission/pick/formalization.yaml                  Pick's theorem
#
# The repository-root formalization.yaml remains the repo-wide record covering all three.
version: "v0.3"

project:
  name: "jordan_pick — Radó's theorem (Lean 4 / Mathlib)"
  authors:
    # Human director of the project. The Lean text itself is agent-produced under that
    # direction; see `automation` for the models, harness, and verification gate.
    - "Rado Kirov"
  responsible_maintainers:
    - name: "Rado Kirov"
      github: "rkirov"
      role: "author and sole maintainer of the substantive formalization"
  license: "Apache-2.0"        # matches the root LICENSE file (Apache License 2.0)

repository:
  role: "substantive-development"
  # The substantive development is Rado/ in this repository. submission/rado_riemannSurface/
  # is a thin Challenge/Solution workspace that re-exposes it to Comparator, vendored from
  # Rado/ by scripts/make_rado_submission.sh so it compiles against Mathlib alone.

classification:
  # Classifies the submitted result — Radó's theorem — and nothing else in the repository.
  arxiv:
    - "math.CV"    # Riemann surfaces, Perron's method, harmonic functions
    - "math.GN"    # the conclusion is second countability of the surface topology
  msc2020:
    - "30F20"      # Classification theory of Riemann surfaces — where Radó's theorem sits
    - "30F15"      # Harmonic functions on Riemann surfaces — Perron's method, the engine
    - "30F25"      # Ideal boundary theory for Riemann surfaces (Ahlfors–Sario context)
    - "30F99"      # Riemann surfaces, miscellaneous
    - "54D65"      # Separability of topological spaces — the second-countable conclusion
    - "32Q55"      # Topological aspects of complex manifolds
    - "31A05"      # Harmonic, subharmonic, superharmonic functions in two dimensions

sources:
  - title: "Über den Begriff der Riemannschen Fläche (the original statement of Radó's theorem)"
    authors: ["Tibor Radó"]
    id: >
      Acta Litt. Sci. Reg. Univ. Hung. Francisco-Josephinae, Sect. Sci. Math. (Szeged) 2 (1925),
      101-121. No DOI known to us; this is the standard bibliographic reference.
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "n/a"
    note: >
      Cited as the origin of the theorem. Radó's original argument was not consulted; the
      route formalized here is the Perron treatment of Anghel-Stan below.
  - title: "Uniformization of Riemann surfaces revisited"
    authors: ["Cipriana Anghel", "Rareş Stan"]
    id: "arXiv:2008.12189v2; Ann. Global Anal. Geom. 62 (2022), 603-615; doi:10.1007/s10455-022-09860-2"
    type: "paper"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >
      The primary mathematical source. Their paper proves the uniformization theorem; what is
      formalized here is its Radó/Perron portion (Definition 2, Proposition 3, Remark 4,
      Theorem 6, Theorem 7), not uniformization itself. Informal mathematics only — no prior
      formalization of this paper is known to us. Two formalization-motivated deviations from
      their route are recorded under `fidelity.divergences` and in Rado/PLAN.md.
  - title: "Lectures on Riemann Surfaces (GTM 81), §22-23"
    authors: ["Otto Forster"]
    id: "Springer GTM 81 (1981); doi:10.1007/978-1-4612-5961-9"
    type: "book"
    relationship: "background"
    author_endorsement: "n/a"
    note: >
      Source for the two ingredients stated there in the form used: the Poincaré-Volterra
      lemma (23.2) and the Dirichlet problem on a disk (22.3). Both are proved from scratch
      in Rado/; nothing is assumed from this source.
  - title: "Riemann Surfaces (Vienna lecture notes)"
    authors: ["Armin Rainer"]
    id: "https://www.mat.univie.ac.at/~armin/lect/Riemann_surfaces.pdf"
    type: "other"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >
      Unpublished lecture notes following Forster; the accessible rendering of Forster §22-23
      actually read while formalizing. Recorded for transparency about what was consulted.
  - title: "Teichmüller theory and applications to geometry, topology, and dynamics, Vol. 1, §1.2-1.3"
    authors: ["John Hamal Hubbard"]
    id: "Matrix Editions (2006), ISBN 978-0-9715766-2-9"
    type: "book"
    relationship: "background"
    author_endorsement: "n/a"
    note: >
      The source cited by the lean-eval problem statement; consulted for the statement's
      intended reading. The freely available Chapter 1 excerpt was used.
  - title: "lean-eval problem `rado_riemannSurface` (the exact formal statement submitted)"
    authors: ["Junyan Xu (problem submitter)", "Lean FRO (leanprover/lean-eval)"]
    id: "https://lean-lang.org/eval/problems/rado_riemannSurface/"
    type: "other"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >
      Not a mathematical source: this is the formal specification whose Lean statement is
      proved verbatim, recorded so a reader can see the statement was fixed by a third party
      rather than chosen here. The repository no longer targets lean-eval and no longer
      tracks that harness's toolchain pin.

