status:
  scope: >
    Radó's theorem: every connected Hausdorff Riemann surface is second countable. Second
    countability is usually imposed as part of the definition of a Riemann surface; Radó's
    theorem says the assumption is redundant, and that the complex structure alone forces it.
    The corresponding statement is false for real surfaces — the Prüfer surface is a connected
    Hausdorff real-analytic 2-manifold that is not second countable — so the proof must use
    complex analysis, and this one does.
    Not present in Mathlib at the pinned revision db584cd6, checked by searching that checkout;
    that absence is why the result was posed as a formalization problem. No novelty is claimed
    for the theorem, which is classical, nor for formalizing it in general. We are not aware of
    a prior formalization of Radó's theorem in any proof assistant, and that is the limit of
    what our search established; two earlier automated solutions of the same problem statement
    exist behind private repositories and are recorded under `related_formalizations`.
    The repository snapshot is licensed Apache-2.0 (root LICENSE).
  sorry_count: 0                        # Scope: the submitted result and the Rado/ library it
                                        # is built from. Excludes the deliberate `sorry` in
                                        # Challenge.lean, which is the statement hole
                                        # Comparator requires. The unrelated, in-progress
                                        # Uniformization/ development is NOT covered — see
                                        # `in_progress`.
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  in_progress:
    - directory: "Uniformization/"
      goal: "the uniformization theorem (Hubbard, Teichmüller theory Vol. 1, Thm 1.1.2)"
      sorry_count: 2
      notes: >
        A separate, unfinished development in the same repository. It is not submitted, nothing
        in this entry depends on it, and the counts above exclude it. Recorded so those counts
        are not mistaken for a repository-wide claim.
  main_results:
    - declaration: "rado_riemannSurface"   # root namespace, as selected by theorem_names
      file: "Challenge.lean (statement); Solution.lean (proof)"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "submission/rado_riemannSurface/config.json"
      literature_dependencies: []          # none: the proof is complete, with no result
                                           # assumed from the literature
      note: >
        Bridged to Rado.secondCountableTopology_of_riemannSurface in
        Submission/Surface/Assembly.lean (Rado/Surface/Assembly.lean in the library).
    - declaration: "isManifold_omega_of_one"
      file: "Submission/Surface/HolomorphicCompat.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: >
        Not separately submitted. Proves that the surface hypothesis used in the Challenge is
        the Riemann-surface hypothesis: over ℂ, `C^1` chart compatibility implies analytic
        compatibility. See `fidelity.definitions`.
    - declaration: "Rado.poincare_volterra"
      file: "Submission/Topology/PoincareVolterra.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: "Forster 23.2, proved from scratch; the counting step of the proof."
    - declaration: "Rado.exists_harmonic_extension"
      file: "Submission/Complex/Poisson.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: "Forster 22.3 (Dirichlet problem on a disk, via the Poisson kernel), from scratch."
    - declaration: "Rado.IsPerronFamily.surfaceHarmonicOn_perronSup"
      file: "Submission/Surface/Perron.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
      note: "Perron's principle on a Riemann surface (Anghel-Stan Prop. 3), from scratch."

