automation:
  methods:
    - method: "autonomous"              # agentic formalization: high-level human prompts; Claude Code drives end-to-end
      models: ["claude-fable-5", "claude-opus-4-8"]
      framework: "Claude Code"
      tool_setup: >
        Claude Code with background sub-agent orchestration; soundness gate: every claimed close is
        independently kernel-verified via `#print axioms` (sorryAx must be absent) before being
        trusted; each commit is `lake build`-green. Heartbeat/performance passes are profiler-driven
        (`#count_heartbeats` with Elab.async off, `set_option diagnostics true`).
      cost:
        wall_time: "assembled repo history 2026-06-26 to 2026-07-02 (development predates the assembled history)"
        spend_usd: "subscription-based usage, $100/month subscription"
        hardware: "single 4-core / ~8 GB laptop; API-only model access"
      prompting_notes: >
        Steered with terse high-level directives; discipline encoded in project memory: connect
        already-proven pieces bottom-up, verify every agent commit by kernel axiom checks, flag
        (don't fake) false-as-stated statements.
  spend_usd: "subscription-based usage"
  notes: >
    ~22.6k lines of Lean code across 24 files, sorry-free, zero custom axioms, zero compiler
    warnings, and no maxHeartbeats overrides (every proof fits the default 200k budget).

fidelity:
  divergences: >
    Area in Pick's theorem is the genuine Lebesgue measure of the winding interior — NOT
    shoelace-as-definition; the shoelace identity is proved (Green: area = ∫∫ winding = shoelace).
    The spine is the winding number as a per-edge signed ray-crossing sum (pure integer arithmetic —
    no transcendental angles, no general topology); the polygonal JCT follows a crossing-alternation
    route; the area identity reduces to triangles by ear-clipping induction (Meisters two-ears via a
    deepest-contained-vertex diagonal split). The continuous JCT is a separate development
    (independent of the polygonal one): Maehara's Brouwer-based proof, with Brouwer built from the
    ground up (covering-space path lifting for the circle, no-retraction, ray-retraction on the
    disk, nearest-point projection for convex compacts). The lean-eval bridge matches the harness
    statements verbatim (Mathlib Polygon, topological interior, no orientation hypothesis).

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    Verification is by Lean's kernel: `#print axioms` on every main result (all report
    [propext, Classical.choice, Quot.sound], no sorryAx), the full `lake build` (green, ~8.6k jobs,
    zero warnings), and the repo-wide zero-sorry sweep. No external peer review yet; expert review
    is welcome.

alignment:
  namespace: "Pick (Pick's theorem + polygonal JCT), JordanCurve (continuous JCT + Brouwer), LeanEval.Geometry.PicksTheorem (eval bridge)"
  statements:
    - source: "lean-eval pick — https://lean-lang.org/eval/problems/pick/"
      lean: "LeanEval.Geometry.PicksTheorem.pick"
      module: "JordanPick/PicksTheorem/EvalBridgeMain.lean"
      status: "proved"
      note: "exact harness statement (Mathlib Polygon, topological interior, no orientation hypothesis), bridged to Pick.pick"
    - source: "lean-eval jordan_curve — https://lean-lang.org/eval/problems/jordan_curve/"
      lean: "JordanCurve.jordan_curve"
      module: "JordanPick/JordanCurve.lean"
      status: "proved"
      note: "exact harness statement: Nat.card (ConnectedComponents (range r)ᶜ) = 2 for a continuous injection r : sphere 0 1 → ℝ²"
    - source: "Freek Wiedijk, Formalizing 100 Theorems #92 (Pick's theorem)"
      lean: "Pick.pick"
      module: "JordanPick/PicksTheorem/Pick.lean"
      status: "proved"
      note: "area = I + B/2 − 1 with area the Lebesgue measure of the winding interior"
    - source: "Polygonal Jordan curve theorem"
      lean: "Pick.LatticePolygon.compl_boundary_atMost_two"
      module: "JordanPick/PicksTheorem/Pick.lean"
      status: "proved"
      note: "complement of a simple polygon's boundary has at most two components; winding locally constant ∈ {0,1}"
    - source: "Brouwer fixed point theorem (2-D, convex compact)"
      lean: "JordanCurve.Brouwer.brouwerFPT"
      module: "JordanPick/JordanCurve/Brouwer.lean"
      status: "proved"
      note: "self-contained against Mathlib: covering-space path lifting → no-retraction → disk → convex compact"

