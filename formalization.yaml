      file: "JordanPick/PicksTheorem/EvalBridgeMain.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "submission/pick/config.json"
      literature_dependencies: []
