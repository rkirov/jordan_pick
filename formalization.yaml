  reviewers: []
  notes: >
    Verification here is by Lean's kernel, not by a human or by peer review. Specifically:
    `#print axioms` on every main result reports exactly [propext, Classical.choice, Quot.sound]
    with no sorryAx; the full `lake build` is green with zero warnings; and a repository-wide
    sweep confirms no `sorry` outside Uniformization/. The rado_riemannSurface submission also
    passed the lean-eval comparator on 2026-07-10, which independently re-checks the axiom
    surface against the permitted set. What none of this establishes is that a mathematician has
    read the proofs: no expert review has taken place, and the informal accounts in this file and
    in README.md were written by the same process that produced the Lean. Expert review is
    welcome. Junyan Xu, who submitted the rado_riemannSurface eval problem, has expressed
    interest in upstreaming pieces of the Radó development — the Poincaré-Volterra lemma, the
    Dirichlet disk solution, and Perron's principle — to Mathlib; that is an expression of
    interest, not a review or an endorsement of this submission.

alignment:
  namespace: >
    Pick (Pick's theorem and the polygonal JCT), JordanCurve (continuous JCT and Brouwer),
    LeanEval.Geometry.PicksTheorem (the Pick eval bridge), Rado (Radó's theorem), and the root
    namespace for the three submitted statements `pick`, `jordan_curve`, `rado_riemannSurface`.
  statements:
    # --- submitted entry 1 of 3 -----------------------------------------------------
    - source: "lean-eval `pick` — https://lean-lang.org/eval/problems/pick/ (Pick's theorem, Pick 1899)"
      lean: "pick"
      module: "Challenge (submission/pick/Challenge.lean), proved in Solution (submission/pick/Solution.lean)"
      comparator_config: "submission/pick/config.json"
      status: "proved"
      plain_language: >
        A simple polygon whose vertices all sit on the integer lattice has area exactly
        I + B/2 - 1, where I counts the lattice points strictly inside it and B counts those on
        its boundary. Here "area" is the Lebesgue measure of the region the polygon encloses,
        so the identity relates a measure-theoretic quantity to two integer counts.
      note: >
        The harness statement verbatim, with at least three vertices and simplicity as the only
        hypotheses — Mathlib's `Polygon`, the topological interior, and no orientation
        assumption. Bridged to LeanEval.Geometry.PicksTheorem.pick
        (JordanPick/PicksTheorem/EvalBridgeMain.lean), thence to Pick.pick.
    # --- submitted entry 2 of 3 -----------------------------------------------------
    - source: "lean-eval `jordan_curve` — https://lean-lang.org/eval/problems/jordan_curve/ (Jordan curve theorem, Jordan 1887 / Veblen 1905)"
      lean: "jordan_curve"
      module: "Challenge (submission/jordan_curve/Challenge.lean), proved in Solution (submission/jordan_curve/Solution.lean)"
      comparator_config: "submission/jordan_curve/config.json"
      status: "proved"
      plain_language: >
        Any curve in the plane that is a continuous, injective image of a circle cuts the plane
        into exactly two pieces: the complement of the curve has precisely two connected
        components, an inside and an outside. No smoothness, piecewise-linearity, or rectifiability
        is assumed — the hypothesis is bare continuity plus injectivity.
      note: >
        The harness statement verbatim:
        `Nat.card (ConnectedComponents (Set.range r)ᶜ) = 2` for a continuous injection
        r : Metric.sphere (0 : EuclideanSpace R (Fin 2)) 1 -> EuclideanSpace R (Fin 2).
        Bridged to JordanCurve.jordan_curve (JordanPick/JordanCurve.lean).
    # --- submitted entry 3 of 3 -----------------------------------------------------
    - source: "lean-eval `rado_riemannSurface` — https://lean-lang.org/eval/problems/rado_riemannSurface/ (Radó's theorem, Radó 1925)"
      lean: "rado_riemannSurface"
      module: "Challenge (submission/rado_riemannSurface/Challenge.lean), proved in Solution (submission/rado_riemannSurface/Solution.lean)"
      comparator_config: "submission/rado_riemannSurface/config.json"
      status: "proved"
      plain_language: >
        Every connected Riemann surface has a countable base of open sets. Second countability is
        usually imposed as part of the definition of a Riemann surface; Radó's theorem says the
        assumption is redundant — a connected Hausdorff space that merely carries a
        one-dimensional complex-analytic atlas is automatically second countable, hence
        metrizable and triangulable. The complex structure, not any topological hypothesis beyond
        connectedness and Hausdorffness, forces the countability.
      note: >
        The harness statement verbatim: a connected T2 `ChartedSpace C` satisfying
        `IsManifold (modelWithCornersSelf C C) 1` has `SecondCountableTopology`, stated in pure
        Mathlib terms. Passed the lean-eval comparator on 2026-07-10. Bridged to
        Rado.secondCountableTopology_of_riemannSurface (Rado/Surface/Assembly.lean); the proof
        route is Perron on a two-disk configuration -> an étale space of exact
        harmonic-conjugate germs -> Poincaré-Volterra -> descent (route A', Rado/PLAN.md).
    # --- further repository results, not separately submitted ------------------------
    - source: "Freek Wiedijk, Formalizing 100 Theorems #92 (Pick's theorem) — library form"
      lean: "Pick.pick"
      module: "JordanPick/PicksTheorem/Pick.lean"
      status: "proved"
      note: >
        area = I + B/2 - 1 for a positively-oriented simple LatticePolygon, with area the
        Lebesgue measure of the winding interior.
    - source: "Polygonal Jordan curve theorem"
      lean: "Pick.LatticePolygon.compl_boundary_atMost_two"
      module: "JordanPick/PicksTheorem/Pick.lean"
      status: "proved"
      note: >
        The complement of a simple polygon's boundary is covered by two preconnected pieces, with
        the winding number locally constant and valued in {0,1}.
    - source: "Brouwer fixed point theorem in dimension 2 (nonempty compact convex sets)"
      lean: "JordanCurve.Brouwer.brouwerFPT"
      module: "JordanPick/JordanCurve/Brouwer.lean"
      status: "proved"
      note: >
        Built from scratch against Mathlib: covering-space path lifting for the circle ->
        no-retraction -> the disk -> nonempty compact convex sets.
    - source: "Forster, Lectures on Riemann Surfaces §23.2 (Poincaré-Volterra lemma)"
      lean: "Rado.poincare_volterra"
      module: "Rado/Topology/PoincareVolterra.lean"
      status: "proved"
      note: >
        A connected, Hausdorff, locally compact, locally connected, locally second-countable
        space admitting a continuous discrete-fiber map to a second-countable Hausdorff space is
        second countable. Proved from scratch, not assumed.
    - source: "Forster, Lectures on Riemann Surfaces §22.3 (Dirichlet problem on a disk)"
      lean: "Rado.exists_harmonic_extension"
      module: "Rado/Complex/Poisson.lean"
      status: "proved"
      note: >
        Continuous boundary data on a circle extends continuously to the closed disk and
        harmonically inside. Proved from scratch, not assumed.
    - source: "Anghel-Stan, Uniformization of Riemann surfaces revisited, Proposition 3 (Perron's principle)"
      lean: "Rado.IsPerronFamily.surfaceHarmonicOn_perronSup"
      module: "Rado/Surface/Perron.lean"
      status: "proved"
      note: "The upper envelope of a Perron family on a Riemann surface is harmonic."
    - source: "Uniformization theorem (Hubbard, Teichmüller theory Vol. 1, Thm 1.1.2)"
      lean: "LeanEval.Geometry.uniformization"
      module: "Uniformization/Main.lean"
      status: "in-progress"
      note: >
        NOT submitted and NOT axiom-clean: depends on sorryAx through two open inputs itemized
        in `status.in_progress`. Listed here only so that its presence in this repository is not
        mistaken for a completed result.

acknowledgements: >
  Built on Mathlib (Lean 4, pin 905b95818eb32af7874a58b427f50c1711a5e96c) and released under
  Apache-2.0. The count side of Pick's theorem follows the discrete-angle-weight device of
  Michael Eisermann (arXiv:2603.23095); the continuous Jordan curve theorem follows Maehara's
  Brouwer-based proof; the ear-clipping reduction rests on Meisters' two-ears theorem; and the
  Radó development follows the Perron treatment of Anghel and Stan (arXiv:2008.12189), with the
  Poincaré-Volterra lemma and the Dirichlet problem taken in the form given by Forster (GTM 81
  §22-23, read via Armin Rainer's Vienna lecture notes) and Hubbard's Teichmüller theory §1.3 as
  the eval problem's cited source. Everything else is clean-room. Prior formalizations — Harrison
  in HOL Light, Binder and Kosaian in Isabelle/HOL, Eisermann in Lean, and the Mizar and
  Isabelle/HOL Jordan curve developments — are credited as prior art in
  `related_formalizations`; no code was ported from any of them. The three formal problem
  statements are by the Lean FRO (leanprover/lean-eval); the rado_riemannSurface problem was
  submitted by Junyan Xu.
