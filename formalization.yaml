status:
  scope: >
    COMPLETE. Pick's theorem (Freek's Formalizing 100 Theorems #92) for simple lattice
    polygons with area as genuine Lebesgue measure (area = I + B/2 − 1), the polygonal Jordan curve
    theorem (winding ∈ {0,1}, complement has at most two components), the full continuous Jordan
    curve theorem (a continuous injection S¹ → ℝ² has a complement with exactly two connected
    components), the 2-D Brouwer fixed point theorem, and Radó's theorem (every connected Hausdorff
    Riemann surface is second countable) — all missing from Mathlib. All three lean-eval problems
    (pick, jordan_curve, rado_riemannSurface) are proved in their exact harness statements against
    the harness's pinned toolchain (Lean v4.32.2, Mathlib 905b9581); the rado_riemannSurface
    submission passed the lean-eval comparator (2026-07-10).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:                               # the complete axiom surface of every declaration in the repo
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
