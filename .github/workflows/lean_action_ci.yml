name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fetches the prebuilt Mathlib cache, then `lake build`s the library.
      # (The `docgen-action` step was removed: doc generation is not needed for a
      # proof library, requires GitHub Pages to be enabled, and is OOM-prone on a
      # large development — a common CI-failure cause for this template.)
      - uses: leanprover/lean-action@v1
