name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lean-action installs elan (which auto-fetches the per-directory toolchain
      # pinned in site/lean-toolchain, v4.30.0) and caches .lake. The site is an
      # independent Lake package that does NOT import the proof, so no Mathlib
      # cache is needed. Build is deferred to the explicit step below.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Build the Verso exposition
        run: |
          cd site
          lake exe jordanpicksite        # emits site/_out/html-multi/

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -r site/_out/html-multi/* _site/
          [ -f site/404.html ] && cp site/404.html _site/404.html || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
