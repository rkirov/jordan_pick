name = "jordan_pick"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["JordanPick", "Rado"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"

[[lean_lib]]
name = "JordanPick"

[[lean_lib]]
name = "Rado"

[[lean_lib]]
name = "Uniformization"
